name: kafka-consumer-test

services:
  consumer-service:
    build: .
    container_name: ic_consumer_test
    network_mode: "host"
    env_file:
      - ../.env
    environment:
      - KAFKA_BROKER_URL=localhost:9093
      - KAFKA_TOPIC=video_copy_events
      - PROCESSING_API_URL=http://localhost:9998/process-videos/
      - UI_API_URL=http://localhost:8086/api/task
      - AI_FOLDER_PATH=${AI_FOLDER_PATH}
      - AI_OUTPUT_SUBPATH=${AI_OUTPUT_SUBPATH}
    restart: always
